display_information:
  name: Pickup Pal
  description: Large Parcel OTR pickup assistant for supplier and carrier schedule questions
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Pickup Pal
    always_online: true
  slash_commands:
    - command: /pickup-pal
      description: Query large parcel pickup schedules and volume
      usage_hint: "[extra-pickup|pickups|typical-days] [supplier name]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
